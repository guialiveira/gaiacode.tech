server {
  listen 80;
  server_name gaiacode.tech www.gaiacode.tech;

  return 301 https://gaiacode.tech$request_uri;
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
